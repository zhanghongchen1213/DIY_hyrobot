###
# 融合轮式里程计 (Wheel Odometry) 与 IMU 数据
# 最终线速度 (Linear Velocity) ： 100% 取决于 轮式里程计 。
# 最终角速度 (Angular Velocity) ： 100% 取决于 IMU 陀螺仪 。
# 最终姿态 (Orientation/Quaternion) ： 100% 取决于 IMU 数据 （融合了 IMU 的四元数和角速度）。
# 最终位置 (Position X, Y) ：由 轮式线速度 和 IMU 朝向 共同积分计算得出。
###
ekf_filter_node:
  ros__parameters:
    # 频率: 50Hz
    frequency: 50.0

    # 传感器超时时间: 0.1s (若超过此时间未收到数据，则不进行预测)
    sensor_timeout: 0.1

    # 2D 模式: True (因为是地面机器人，忽略 Z 轴、Roll、Pitch)
    two_d_mode: true

    # 是否发布 TF (odom -> base_link)
    publish_tf: true

    # 坐标系定义
    map_frame: map # 地图坐标系 (通常由 AMCL/SLAM 发布 map->odom)
    odom_frame: odom # 里程计坐标系 (本节点发布 odom->base_link)
    base_link_frame: base_link # 机器人基座标系
    world_frame: odom # 本地世界坐标系 (设置为 odom，表示输出局部里程计)

    # --------------------------------------
    # 输入源 1: 轮式里程计 (Wheel Odometry)
    # --------------------------------------
    odom0: /uart/wheel_odom

    # 配置矩阵: 指定使用哪些字段 (True 表示使用，False 表示忽略)
    # 顺序: x, y, z,
    #       roll, pitch, yaw,
    #       vx, vy, vz,
    #       vroll, vpitch, vyaw,
    #       ax, ay, az
    #
    # 说明:
    # - 使用位置 (x, y) 和 偏航角 (yaw) 进行绝对位置更新 (如果不漂移严重的话)
    # - 使用线速度 (vx) 和 角速度 (vyaw) 进行速度更新
    # - 对于轮式里程计，通常信任其速度更甚于位置(位置是积分来的)，但如果只是做 odom->base_link，全信也没问题。
    # - 这里的配置方案：仅使用速度 (vx, vyaw)，让 EKF 积分位置。这样可以避免位置突变，且利用 IMU 修正航向。
    odom0_config:
      [
        false,
        false,
        false,
        false,
        false,
        false,
        true,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
      ]

    # 是否差分: False (因为我们用的是速度，速度本身就是差分量。如果用位置且需要差分才设为 True)
    odom0_differential: false

    # 是否相对: False (数据是绝对值还是相对值)
    odom0_relative: false

    # 队列大小
    odom0_queue_size: 10

    # --------------------------------------
    # 输入源 2: IMU (Inertial Measurement Unit)
    # --------------------------------------
    imu0: /uart/imu_data

    # 配置矩阵:
    # 顺序: x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    #
    # 说明:
    # - 使用角速度 (vyaw) 修正航向变化率
    # - 使用朝向 (yaw) 修正绝对航向 (如果 IMU 提供四元数)
    # - 2D 模式下忽略 roll/pitch
    imu0_config:
      [
        false,
        false,
        false,
        false,
        false,
        true,
        false,
        false,
        false,
        false,
        false,
        true,
        false,
        false,
        false,
      ]

    # 差分: False (如果是绝对朝向则 False，如果是累积误差较大的磁力计可能需要 True，但这里通常 False)
    # 注意: 如果 IMU 的 yaw 是相对于上电时的 0，而不是磁北，最好设为 differential: true 或者 relative: true
    # 这里的建议: 如果 IMU 输出的是绝对朝向（有磁力计），设为 false；如果是上电 0，设为 true 或 relative true。
    # 鉴于通常低成本 IMU 只是陀螺仪积分，设为 differential: false 配合 relative: true 比较稳妥，或者只用角速度。
    # 方案 A (推荐): 使用 yaw (relative=true) + vyaw
    imu0_differential: false
    imu0_relative: true

    # 移除重力加速度影响
    imu0_remove_gravitational_acceleration: true

    imu0_queue_size: 10

    # --------------------------------------
    # 过程噪声协方差 (Process Noise Covariance)
    # --------------------------------------
    # 默认值通常可以工作，若效果不佳需微调。
